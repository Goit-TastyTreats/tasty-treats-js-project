
   <section class="filters-section">
        <div class="filters-container">
            <form class="filters-form">
                <label class="filter-label search-field">
                    Search
                    <span class="search-wrapper">
                        <span class="search-icon">⌕</span>
                        <input class="filter-input search-input" type="text" name="search" placeholder="Enter Text"
                            autocomplete="off" />
                    </span>
                </label>

                <label class="filter-label time-field">
                    Time
                    <span class="select-wrapper">
                        <select class="filter-select time-select" name="time">
                            <option value="">Any time</option>
                        </select>
                        <span class="select-chevron"></span>
                    </span>
                </label>

                <label class="filter-label area-field">
                    Area
                    <span class="select-wrapper">
                        <select class="filter-select area-select" name="area">
                            <option value="">Any area</option>
                        </select>
                        <span class="select-chevron"></span>
                    </span>
                </label>

                <label class="filter-label ingredients-field">
                    Ingredients
                    <span class="select-wrapper">
                        <select class="filter-select ingredients-select" name="ingredient">
                            <option value="">Any ingredient</option>
                        </select>
                        <span class="select-chevron"></span>
                    </span>
                </label>
            </form>

            <button class="reset-btn" type="button">
                Reset the filter
            </button>
        </div>
    </section>
