<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Favorites</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <load
      src="./partials/header.html"
      icon-path="./img/sprite.svg#logo"
      highlight-act="active"
    />

    <main>
   
<!-- favorites -->
<section class="fav-hero-section">
  <div class="container fav-hero-container">
    <picture class="fav-hero-pic">
      <source media="(min-width: 1280px)" srcset="
                ./src/img/webp/favorites-desktop_1x.webp    1x,
                ./src/img/webp/favorites-desktop_2x.webp 2x
              " />

      <source media="(min-width: 768px)" srcset="
                ./src/img/webp/favorıtes-tablet_1x.webp    1x,
                ./src/img/webp/favorıtes-tablet_2x.webp 2x
              " />

      <source media="(max-width: 767px)" srcset="
                ./src/img/webp/favorites-mob_1x.webp    1x,
                ./src/img/webp/favorites-mob_2x.webp 2x
              " />

      <img loading="lazy" src="./src/img/webp/favorıtes-desktop_1x.webp" alt="Dish" />
    </picture>
  </div>
</section>
<!-- fav
      -->
<section class="fav-content-section">
  <div class="container fav-content-container">
    <ul class="fav-category-recipe-list recipes-list">
      <button type="button" class="all-category-btn category-btn">
        All categories
      </button>
    </ul>

    <ul class="fav-recipes-list"></ul>

    <div class="fav-no-recipes-content is-hidden">
      <svg class="no-recipes-icon">
        <use href="./src/img/webp/favicon.svg"></use>
      </svg>

      <p class="no-recipes-descr">
        It appears that you haven't added any recipes to your favorites
        yet. To get started, you can add recipes that you like to your
        favorites for easier access in the future.
      </p>
    </div>
  </div>
</section>

</main>

    <load src="./partials/footer.html" />
  </body>
</html>
